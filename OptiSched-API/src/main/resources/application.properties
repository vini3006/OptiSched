spring.application.name=optisched-api
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# Lets Tomcat trust X-Forwarded-For from the production Caddy reverse proxy
# (docker-compose.prod.yml, item A5) so request.getRemoteAddr() sees the real
# client IP instead of Caddy's own address — RateLimitingFilter depends on
# this to key its buckets per real client rather than lumping everyone
# together. Safe in dev too: with no reverse proxy in front, there's no
# X-Forwarded-For header to trust in the first place.
server.forward-headers-strategy=native
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
optimizer.url=${OPTIMIZER_URL:http://localhost:8000}
optimizer.internal-key=${OPTIMIZER_INTERNAL_KEY:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
app.cookie.secure=${COOKIE_SECURE:false}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.email.provider=${EMAIL_PROVIDER:log}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.from=${RESEND_FROM_EMAIL:OptiSched <onboarding@resend.dev>}
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,info,prometheus

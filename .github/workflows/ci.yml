name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OptiSched-API
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        # Testcontainers spins up a real postgres:16 + redis:7-alpine
        # container per AbstractIntegrationTest — Docker is preinstalled and
        # running on GitHub-hosted ubuntu-latest runners, no extra setup needed.
        run: mvn -B test

      - name: Cache OWASP Dependency-Check NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-${{ github.run_id }}
          restore-keys: |
            dependency-check-nvd-

      - name: Dependency vulnerability scan (OWASP Dependency-Check)
        # failBuildOnCVSS=9 (in pom.xml): deliberately permissive gate (item
        # A7) — only Critical-severity findings fail the build.
        #
        # Needs a one-time manual step: NIST's NVD API rate-limits
        # unauthenticated requests hard enough that the first data sync can
        # be very slow or fail outright without an API key. Get a free key
        # at https://nvd.nist.gov/developers/request-an-api-key and add it
        # as a repo secret named NVD_API_KEY — this step works without one,
        # just less reliably on a cold cache.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B org.owasp:dependency-check-maven:check

  optimizer:
    name: Optimizer (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OptiSched-Optimizer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: OptiSched-Optimizer/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Dependency vulnerability scan
        # Unlike npm audit / OWASP Dependency-Check below, pip-audit has no
        # severity field to gate on (checked its JSON output directly against
        # a known-CVE package) — every reported vulnerability fails this
        # step, full stop. Runtime deps only (requirements.txt) — pytest and
        # friends in requirements-dev.txt never ship to production.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OptiSched-Web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: OptiSched-Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Dependency vulnerability scan
        # --audit-level=high: deliberately permissive gate (item A7) — only
        # high/critical severity fails the build, so a moderate-severity
        # false positive doesn't block every PR. Tighten later if needed.
        run: npm audit --audit-level=high

  build-and-push:
    name: Build & push images (GHCR)
    needs: [api, optimizer, web]
    # Only publish from main after a real push — never from a PR (a fork PR
    # wouldn't have package-write access anyway, and we don't want to publish
    # :latest from unmerged code).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./OptiSched-API
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/optisched-api:latest

      - name: Build & push Optimizer image
        uses: docker/build-push-action@v6
        with:
          context: ./OptiSched-Optimizer
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/optisched-optimizer:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull new images and restart stack on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/OptiSched
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

      - name: Smoke test (public health endpoint)
        # Rollback in this v1 is manual: repoint docker-compose.prod.yml at a
        # previous image tag on the EC2 host and re-run `up -d` there.
        run: curl -f --retry 5 --retry-delay 5 https://api.optisched.com.br/actuator/health
